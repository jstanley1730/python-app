name: ci

on:
  push:
    paths:
      - src/**
      - .github/workflows/**
      - charts/**
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    outputs:
      short_sha: ${{ steps.sha.outputs.short_sha }}
    steps:
      - name: Set short SHA
        id: sha
        run: |
          SHORT_SHA=${GITHUB_SHA::6}
          echo "SHORT_SHA=${SHORT_SHA}" >> $GITHUB_ENV
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: jstanley1730gmailcom/python-app:${{ env.SHORT_SHA }}

  cd:
    runs-on: self-hosted
    needs: ci
    env:
      SHORT_SHA: ${{ needs.ci.outputs.short_sha }}
    steps:

      - name: Clone repo
        uses: actions/checkout@v3

      - name: install yq
        shell: bash
        run: |
          echo ${{ env.SHORT_SHA }}
          sudo apt install python3-pip
          sudo apt install yq
          yq -Yi '.image.tag = "${{ env.SHORT_SHA }}"' charts/chart/values.yaml

      - name: commit tag
        uses: EndBug/add-and-commit@v9
        with:
          message: 'Updates values.yaml with commit ${{ env.SHORT_SHA }}'

      - name: install argocd cli and sync
        shell: bash
        run: |
          curl -ksSL -o argocd https://${{ vars.ARGOCD_HOST }}/download/argocd-linux-${{ vars.HOST_ARCH }}
          chmod +x argocd
          sudo mv ./argocd /usr/local/bin/argocd

      - name: argocd app sync
        shell: bash
        run: |
          argocd login ${{ vars.ARGOCD_HOST }} --insecure --grpc-web --username admin --password ${{ secrets.ARGOCD_PASSWORD }}
          argocd app sync ${{ vars.ARGOCD_APP }}

